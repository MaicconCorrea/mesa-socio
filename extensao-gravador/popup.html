<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="estilo.css"></head>
<body>
  <h1>🎙️ Gravador · Outtax</h1>
  <div id="entrar" hidden>
    <p class="muted">Entre com a sua conta Google da Outtax (uma vez só).</p>
    <button id="login">Entrar com Google</button>
  </div>
  <div id="pronto" hidden>
    <p class="muted" id="ola"></p>
    <label>Nome da reunião</label><input id="titulo">
    <div id="caixaSetor"><label>Setor (onde a reunião vai aparecer)</label><select id="setor"></select></div>
    <button id="gravar" class="vermelho">🔴 Gravar esta aba</button>
    <p class="muted">Grava o som desta aba + o seu microfone. Abre uma janelinha — deixe aberta (pode minimizar) até parar. Avise os participantes.</p>
  </div>
  <div id="gravando" hidden>
    <p>🔴 Gravando: <b id="tituloG"></b></p>
    <button id="parar" class="vermelho">⏹ Parar e resumir</button>
  </div>
  <div id="msg"></div>
  <script src="auth.js"></script>
  <script src="popup.js"></script>
</body></html>
